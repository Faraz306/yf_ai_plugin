name: YF AI Secure Remote Agent Worker

on:
  repository_dispatch:
    types: [yf_remote_agent_task]
  workflow_dispatch: {}
  push:
    branches:
      - master
      - main

permissions:
  contents: write

concurrency:
  group: yf-agent-${{ github.ref || github.event.client_payload.user_id || github.run_id }}
  cancel-in-progress: true

jobs:
  agent_core_runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Print event payload
        run: |
          echo "=== GITHUB EVENT ==="
          echo '${{ toJSON(github.event) }}'
          echo "===================="

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only the runtime libs needed by the headless worker.
          python -m pip install --no-cache-dir groq requests

      - name: Run headless cloud worker
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLIENT_PAYLOAD_TASK: ${{ github.event.client_payload.task || '' }}